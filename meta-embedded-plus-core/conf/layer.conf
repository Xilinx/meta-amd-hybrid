# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have a packages directory, add to BBFILES
BBFILES += " \
    ${LAYERDIR}/recipes-*/*/*.bb \
    ${LAYERDIR}/recipes-*/*/*.bbappend \
    "

BBFILE_COLLECTIONS += "embedded-plus-core"
BBFILE_PRIORITY_embedded-plus-core = "5"

LAYERSUMMARY_embedded-plus-core = "AMD Embedded+ core infra and recipes"
LAYERDESCRIPTION_embedded-plus-core = "Shared non-BSP layer for AMD \
Embedded+ products: image, kernel, library and utility recipes and \
bbappends shared across the Alveo V80 (AMR) and Embedded+ VE2302 (AMR / \
XRT) boards."
BBFILE_PATTERN_embedded-plus-core = "^${LAYERDIR}/"
BBFILE_PATTERN_IGNORE_EMPTY_embedded-plus-core = "1"

LAYERDEPENDS_embedded-plus-core = "core xilinx xilinx-standalone xilinx-standalone-sdt xilinx-microblaze amd-adaptive-socs-core openembedded-layer networking-layer"

LAYERSERIES_COMPAT_embedded-plus-core = "wrynose"
