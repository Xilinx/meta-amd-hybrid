# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have a packages directory, add to BBFILES
BBFILES += " \
    ${LAYERDIR}/recipes-*/*/*.bb \
    ${LAYERDIR}/recipes-*/*/*.bbappend \
    "

BBFILE_COLLECTIONS += "amd-hybrid-bsp"
BBFILE_PRIORITY_amd-hybrid-bsp = "5"

LAYERSUMMARY_amd-hybrid-bsp = "AMD hybrid platform board support and BSP"
LAYERDESCRIPTION_amd-hybrid-bsp = "BSP layer for AMD hybrid \
products: machine .conf, machine YAML, and supporting recipes for the \
Alveo V80 (AMR) and Embedded+ VE2302 (AMR) boards."
BBFILE_PATTERN_amd-hybrid-bsp = "^${LAYERDIR}/"
BBFILE_PATTERN_IGNORE_EMPTY_amd-hybrid-bsp = "1"

LAYERDEPENDS_amd-hybrid-bsp  = "core xilinx xilinx-standalone xilinx-standalone-sdt xilinx-microblaze amd-adaptive-socs-core amd-hybrid-core openembedded-layer meta-python"

LAYERRECOMMENDS_amd-hybrid-bsp = "xilinx-tools"

LAYERSERIES_COMPAT_amd-hybrid-bsp = "wrynose"

LAYER_PATH_amd-hybrid-bsp-layer = "${LAYERDIR}"
