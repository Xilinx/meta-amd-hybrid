#@TYPE: Machine
#@NAME: versal2-2ve-2vm-ve3558-sdt-seg
#@DESCRIPTION: Segmented SDT machine for the AMD Versal Gen 2 VE3558 evaluation kit: Cortex-A78 Linux plus MicroBlaze PMC firmware sub-machine.

BBMULTICONFIG += "versal2-2ve-2vm-ve3558-sdt-seg-microblaze-pmc versal2-2ve-2vm-ve3558-sdt-seg-microblaze-riscv-asu"

#### Preamble
MACHINEOVERRIDES =. "${@['', 'versal2-2ve-2vm-ve3558-sdt-seg:']['versal2-2ve-2vm-ve3558-sdt-seg' !='${MACHINE}']}"
#### Regular settings follow
TUNEFILE[microblaze-pmc] = "conf/machine/include/versal2-2ve-2vm-ve3558-sdt-seg/microblaze.inc"
TUNEFILE[microblaze-v-asu] = "conf/machine/include/versal2-2ve-2vm-ve3558-sdt-seg/microblaze-v.inc"

# Platform Loader and Manager
PLM_DEPENDS = ""
PLM_MCDEPENDS = "mc::versal2-2ve-2vm-ve3558-sdt-seg-microblaze-pmc:plm-firmware:do_deploy"
PLM_DEPLOY_DIR = "${TMPDIR}-versal2-2ve-2vm-ve3558-sdt-seg-microblaze-pmc/deploy/images/${MACHINE}"

# ASU Firmware
ASU_DEPENDS = ""
ASU_MCDEPENDS = "mc::versal2-2ve-2vm-ve3558-sdt-seg-microblaze-riscv-asu:asu-firmware:do_deploy"
ASU_DEPLOY_DIR = "${TMPDIR}-versal2-2ve-2vm-ve3558-sdt-seg-microblaze-riscv-asu/deploy/images/${MACHINE}"

# Set the default (linux) domain device tree
CONFIG_DTFILE_DIR := "${@bb.utils.which(d.getVar('BBPATH'), 'conf/dts/versal2-2ve-2vm-ve3558-sdt-seg')}"
CONFIG_DTFILE ?= "${CONFIG_DTFILE_DIR}/cortexa78-linux.dts"
CONFIG_DTFILE[vardepsexclude] += "CONFIG_DTFILE_DIR"

DTB_FILE_PATH ?= "${RECIPE_SYSROOT}/boot/devicetree/${@os.path.basename(d.getVar('CONFIG_DTFILE').replace('.dts', '.dtb'))}"

# Serial Console Settings
SERIAL_CONSOLES ?= "115200;ttyAMA0"

# Yocto arm-trusted-firmware(TF-A) variables
TFA_CONSOLE ?= "pl011"
TFA_BL33_LOAD ?= "0x40000000"

# Yocto OP-TEE variables
OPTEE_CONSOLE ?= "0"

# Yocto u-boot-xlnx variables
UBOOT_USER_SPECIFIED_TEXT_BASE ?= "0x40000000"

# Set DDR Base address for u-boot-xlnx-scr variables
DDR_BASEADDR ?= "0x0"
SKIP_APPEND_BASEADDR ?= "0"

# Yocto KERNEL Variables
UBOOT_ENTRYPOINT ?= "0x200000"
UBOOT_LOADADDRESS ?= "0x200000"

# Yocto MACHINE_FEATURES Variable
MACHINE_FEATURES += "vcu2 malig78ae asu fpga-overlay efi"

# Required generic machine inclusion
require conf/machine/versal-2ve-2vm-generic.conf

# QEMU Memory Configuration
QB_MEM = "-machine dynamic-mem=on -device amd-ddr-memory,address=0x800000000,size=0x380000000"

# This is an 'SDT' based BSP
XILINX_WITH_ESW = "sdt"

# Original SDT artifacts URL
SDT_URI = "https://edf.amd.com/sswreleases/rel-v2026.2/sdt/2026.2/2026.2_0920_1_09200102/internal/versal2-2ve-2vm-ve3558-sdt-seg/versal2-2ve-2vm-ve3558-sdt-seg_2026.2_0920_1_09200102.tar.gz"
SDT_URI[sha256sum] = "480b7acc24e79af5f96532e37009d444d7a0b0532e0b42f448d28edcb830ad59"
SDT_URI[S] = "${UNPACKDIR}/versal2-2ve-2vm-ve3558-sdt-seg_2026.2_0920_1_09200102"

# Set the system device trees
SYSTEM_DTFILE_DEPENDS = "sdt-artifacts"
SYSTEM_DTFILE_DIR = "${RECIPE_SYSROOT}${datadir}/sdt/${MACHINE}"
SYSTEM_DTFILE = "${SYSTEM_DTFILE_DIR}/system-top.dts"

# Load the dynamic machine features
include conf/machine/include/versal2-2ve-2vm-ve3558-sdt-seg/${BB_CURRENT_MC}-features.conf
LIBXIL_CONFIG = "conf/machine/include/versal2-2ve-2vm-ve3558-sdt-seg/${BB_CURRENT_MC}-libxil.conf"

# PDI variables
PDI_PATH_DEPENDS = "sdt-artifacts"
PDI_PATH_DIR = "${RECIPE_SYSROOT}${datadir}/sdt/${MACHINE}"
PDI_PATH = "${PDI_PATH_DIR}/rave2_base_boot.pdi"

# Primary Bootmode value
DEFAULT_HW_BOOT_MODE = "8"

# Update bootbin to use proper device tree
BIF_PARTITION_IMAGE[device-tree] = "${DTB_FILE_PATH}"

# Remap boot files to ensure the right device tree is listed first
IMAGE_BOOT_FILES =+ "devicetree/${@os.path.basename(d.getVar('CONFIG_DTFILE').replace('.dts', '.dtb'))}"

#### No additional settings should be after the Postamble
#### Postamble
PACKAGE_EXTRA_ARCHS:append = "${@['', ' versal2_2ve_2vm_ve3558_sdt_seg']['versal2-2ve-2vm-ve3558-sdt-seg' != '${MACHINE}']}"
