# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have a packages directory, add to BBFILES
BBFILES += " \
    ${LAYERDIR}/recipes-*/*/*.bb \
    ${LAYERDIR}/recipes-*/*/*.bbappend \
    "

BBFILE_COLLECTIONS += "amd-hybrid-core"
BBFILE_PRIORITY_amd-hybrid-core = "5"

LAYERSUMMARY_amd-hybrid-core = "AMD hybrid platform core infra and recipes"
LAYERDESCRIPTION_amd-hybrid-core = "Shared non-BSP layer for AMD hybrid \
products: image, kernel and library recipes and \
bbappends shared across the Alveo V80 (AMR) and Embedded+ VE2302 (AMR) \
boards."
BBFILE_PATTERN_amd-hybrid-core = "^${LAYERDIR}/"
BBFILE_PATTERN_IGNORE_EMPTY_amd-hybrid-core = "1"

LAYERDEPENDS_amd-hybrid-core = "\
    core \
    xilinx \
    xilinx-standalone \
    xilinx-standalone-sdt \
    xilinx-microblaze \
    amd-adaptive-socs-core \
    openembedded-layer \
    networking-layer \
    "

LAYERSERIES_COMPAT_amd-hybrid-core = "wrynose"
