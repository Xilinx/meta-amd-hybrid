# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have a packages directory, add to BBFILES
BBFILES += " \
    ${LAYERDIR}/recipes-*/*/*.bb \
    ${LAYERDIR}/recipes-*/*/*.bbappend \
    "

BBFILE_COLLECTIONS += "embedded-plus-bsp"
BBFILE_PRIORITY_embedded-plus-bsp = "5"

LAYERSUMMARY_embedded-plus-bsp = "AMD Embedded+ board support and BSP"
LAYERDESCRIPTION_embedded-plus-bsp = "BSP layer for AMD Embedded+ \
products: machine .conf, machine YAML, and supporting recipes for the \
Alveo V80 (AMR) and Embedded+ VE2302 (AMR) boards."
BBFILE_PATTERN_embedded-plus-bsp = "^${LAYERDIR}/"
BBFILE_PATTERN_IGNORE_EMPTY_embedded-plus-bsp = "1"

LAYERDEPENDS_embedded-plus-bsp  = "core xilinx xilinx-standalone xilinx-standalone-sdt xilinx-microblaze amd-adaptive-socs-core embedded-plus-core openembedded-layer meta-python"

LAYERRECOMMENDS_embedded-plus-bsp = "xilinx-tools"

LAYERSERIES_COMPAT_embedded-plus-bsp = "wrynose"

LAYER_PATH_embedded-plus-bsp-layer = "${LAYERDIR}"
